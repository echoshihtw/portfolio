# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Sveltia CMS — a git-based admin at /admin. Editing a post here commits
# markdown straight to this repo, which triggers the usual Vercel deploy.
# No database and no server: the site stays adapter-static, and sign-in is
# a personal access token held in the browser (see the backend note below).

backend:
  name: github
  repo: echoshihtw/portfolio
  branch: main
  # No base_url on purpose. That property points at an OAuth proxy, and
  # Sveltia's own docs say a single technical user doesn't need one —
  # "Sign In Using Access Token" on the login screen covers this case,
  # with no Cloudflare Worker and no GitHub OAuth App to maintain. It
  # links out to GitHub's token page with the right scopes preselected;
  # the token is kept in the browser's local storage.
  #
  # If a proxy is ever wanted — the reason would be non-technical users
  # needing to sign in — deploy sveltia/sveltia-cms-auth and add its URL
  # here as base_url. A base_url pointing at a host that does not exist
  # makes "Sign In with GitHub" fail, so leave it out rather than stub it.

# Where images uploaded through the CMS land, and the path the site serves
# them from. Separate from static/assets, which holds hand-curated project
# screenshots rather than post images.
media_folder: static/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: src/posts
    extension: md
    format: yaml-frontmatter
    create: true
    # Filename becomes the URL: /blog/<slug>.
    slug: "{{slug}}"
    preview_path: blog/{{slug}}
    fields:
      - { name: title, label: Title, widget: string }
      - {
          name: seoTitle,
          label: Search title,
          widget: string,
          required: false,
          hint: "Optional. Overrides the browser/search-result title only — put the literal terms someone would type (an error message, a tool name) here. The heading and social cards keep the Title above.",
        }
      - {
          name: date,
          label: Date,
          widget: datetime,
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - {
          name: excerpt,
          label: Excerpt,
          widget: text,
          hint: "One line on the index — what the post is actually about, not a teaser.",
        }
      - {
          name: order,
          label: Display order,
          widget: number,
          value_type: int,
          hint: "Editorial ranking on the index, lowest first. Not the date — a stronger older post can still lead.",
        }
      # Sveltia treats a field named `body` as the file's main content;
      # everything else above is frontmatter. `markdown` rather than
      # `richtext` so code fences stay raw instead of being reformatted
      # by a WYSIWYG editor.
      - { name: body, label: Content, widget: markdown }
