<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="85%">
      <stop offset="0" stop-color="#2a2350"/>
      <stop offset="1" stop-color="#161233"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <g
    fill="none"
    stroke="#c9c4ff"
    stroke-width="4.6"
    stroke-linecap="round"
    filter="url(#glow)"
  >
    <!-- vertical spine, overshoots top and bottom -->
    <path d="M 17 6 L 15 58" />
    <!-- top stroke, overshoots the spine on both sides -->
    <path d="M 6 17 L 46 12" />
    <!-- middle stroke, overshoots the spine on both sides -->
    <path d="M 9 33 L 39 30" />
    <!-- bottom stroke, overshoots the spine on both sides -->
    <path d="M 5 51 L 47 47" />
  </g>
</svg>
