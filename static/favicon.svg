<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
>
  <!-- The site in miniature: cream paper, ink, cobalt interaction and one
       coral punctuation mark. The offset blue stroke is deliberately a
       little imperfect, like a second pass through a press. -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="13"
    fill="#f3f0e8"
    stroke="#171714"
    stroke-width="2.5"
  />

  <path
    d="M 41 16
       C 30 12, 19 14, 19 22
       C 19 28, 27 28, 34 27
       C 26 28, 19 29, 19 37
       C 19 46, 31 49, 42 43"
    transform="translate(2 2)"
    fill="none"
    stroke="#3155d9"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 41 16
       C 30 12, 19 14, 19 22
       C 19 28, 27 28, 34 27
       C 26 28, 19 29, 19 37
       C 19 46, 31 49, 42 43"
    fill="none"
    stroke="#171714"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    cx="48"
    cy="47"
    r="3.75"
    fill="#f15a3a"
  />
</svg>
