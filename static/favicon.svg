<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="85%">
      <stop offset="0" stop-color="#2a2350"/>
      <stop offset="1" stop-color="#161233"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="halo"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" result="core"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="core"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- single continuous hand-drawn stroke, one neon hue throughout -->
  <path
    d="M 41 17
       C 30 12, 19 14, 19 22
       C 19 28, 27 28, 33 27
       C 26 28, 19 29, 19 37
       C 19 46, 31 48, 42 43"
    fill="none"
    stroke="#a78bfa"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
