<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="85%">
      <stop offset="0" stop-color="#2a2350"/>
      <stop offset="1" stop-color="#161233"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- neon halo: saturated violet, blurred -->
  <g
    fill="none"
    stroke="#8b5cf6"
    stroke-width="3.6"
    stroke-linecap="round"
    filter="url(#glow)"
  >
    <path d="M 25.25 12.5 L 23.75 51.5" />
    <path d="M 17 20.75 L 47 17" />
    <path d="M 19.25 32.75 L 41.75 30.5" />
    <path d="M 16.25 46.25 L 47.75 43.25" />
  </g>

  <!-- neon core: bright, crisp, unblurred -->
  <g
    fill="none"
    stroke="#f2ecff"
    stroke-width="1.5"
    stroke-linecap="round"
  >
    <path d="M 25.25 12.5 L 23.75 51.5" />
    <path d="M 17 20.75 L 47 17" />
    <path d="M 19.25 32.75 L 41.75 30.5" />
    <path d="M 16.25 46.25 L 47.75 43.25" />
  </g>
</svg>
