<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // The old GitHub Pages project URL keeps serving (Vercel can't redirect
      // a domain it doesn't own, and CVs already sent point at it), but the
      // canonical home is echoshih.com now. A client-side redirect is the
      // only option static Pages hosting offers — strip the /portfolio base
      // and forward the rest of the path.
      (() => {
        if (location.hostname !== "echoshihtw.github.io") return;
        const base = "/portfolio";
        const path = location.pathname.startsWith(base)
          ? location.pathname.slice(base.length)
          : location.pathname;
        location.replace(
          "https://echoshih.com" + path + location.search + location.hash,
        );
      })();
    </script>
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.png"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const key = "echo-theme";
        let theme = "light";

        try {
          const savedTheme = localStorage.getItem(key);
          if (savedTheme === "light" || savedTheme === "dark") {
            theme = savedTheme;
          } else if (
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            theme = "dark";
          }
        } catch (_error) {
          theme = "light";
        }

        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Echo Shih — Product Engineer</title>
    <meta
      name="description"
      content="Product engineer in Taipei. I build systems of record — project platforms, applicant tracking, client histories — in React, TypeScript, FastAPI and Flutter."
    />
    <link
      rel="canonical"
      href="https://echoshih.com/"
    />

    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:url"
      content="https://echoshih.com/"
    />
    <meta
      property="og:title"
      content="Echo Shih — Product Engineer"
    />
    <meta
      property="og:description"
      content="From ambiguous product problems to shipped software."
    />
    <meta
      property="og:image"
      content="https://echoshih.com/og-image.png"
    />
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
