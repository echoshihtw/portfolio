<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // The old GitHub Pages project URL keeps serving (Vercel can't redirect
      // a domain it doesn't own, and CVs already sent point at it), but the
      // canonical home is echoshih.com now. A client-side redirect is the
      // only option static Pages hosting offers: strip the /portfolio base
      // and forward the rest of the path.
      (() => {
        if (location.hostname !== "echoshihtw.github.io") return;
        const base = "/portfolio";
        const path = location.pathname.startsWith(base)
          ? location.pathname.slice(base.length)
          : location.pathname;
        location.replace(
          "https://echoshih.com" + path + location.search + location.hash
        );
      })();
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="%sveltekit.assets%/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      href="%sveltekit.assets%/favicon.png"
    />
    <!-- Served from the site and preloaded, so text is set in Geist from
         the first paint and nothing moves when the font arrives. -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/geist-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/geist-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (() => {
        const key = "echo-theme";
        // Start new visitors on paper, the light theme, and remember either
        // choice. The saved preference wins over the OS preference.
        let theme = "light";

        try {
          const savedTheme = localStorage.getItem(key);
          if (savedTheme === "light" || savedTheme === "dark") {
            theme = savedTheme;
          }
        } catch (_error) {
          theme = "light";
        }

        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <!-- Page-specific SEO (title, description, canonical, og tags) is NOT
         set here. This template renders on every route, so anything
         absolute put here follows every page around: it previously shipped
         a canonical pointing at the homepage on every blog post, telling
         search engines each post was a duplicate and to index the homepage
         instead, plus a duplicate page title that won because it rendered
         first. Each route now owns its own tags via the Seo component; see
         src/lib/seo.ts.

         Note: do not write SvelteKit's head placeholder token in this
         comment. It is substituted anywhere it appears, including inside
         comments, which breaks the comment and leaks markup onto the
         page. -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <link
      rel="stylesheet"
      href="%sveltekit.assets%/boot-gate.css"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div
      id="boot-gate"
      role="dialog"
      aria-modal="true"
      aria-label="Portfolio introduction"
    >
      <div class="gate-masthead">
        <p>PORTFOLIO / 2026</p>
        <div class="gate-theme-switch">
          <input
            type="checkbox"
            id="boot-gate-theme-toggle"
            class="gate-theme-input"
            aria-label="Dark theme"
          />
          <label
            for="boot-gate-theme-toggle"
            class="gate-theme-label"
          >
            <span class="gate-theme-core"></span>
          </label>
        </div>
      </div>

      <div class="gate-cover">
        <p class="gate-name">
          <span>Echo</span>
          <span>
            Shih
            <span
              class="gate-accent"
              aria-hidden="true"
            >
              .
            </span>
          </span>
        </p>

        <div class="gate-lower">
          <p class="gate-role">Product Engineer · Taipei</p>
          <button
            type="button"
            class="gate-enter"
            id="boot-gate-enter"
          >
            Enter
            <span aria-hidden="true">→</span>
          </button>
        </div>
      </div>
    </div>
    <script src="%sveltekit.assets%/boot-gate.js"></script>
    <div
      id="app"
      style="display: contents"
    >
      %sveltekit.body%
    </div>
  </body>
</html>
