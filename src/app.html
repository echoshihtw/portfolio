<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // The old GitHub Pages project URL keeps serving (Vercel can't redirect
      // a domain it doesn't own, and CVs already sent point at it), but the
      // canonical home is echoshih.com now. A client-side redirect is the
      // only option static Pages hosting offers — strip the /portfolio base
      // and forward the rest of the path.
      (() => {
        if (location.hostname !== "echoshihtw.github.io") return;
        const base = "/portfolio";
        const path = location.pathname.startsWith(base)
          ? location.pathname.slice(base.length)
          : location.pathname;
        location.replace(
          "https://echoshih.com" + path + location.search + location.hash
        );
      })();
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="%sveltekit.assets%/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      href="%sveltekit.assets%/favicon.png"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const key = "echo-theme";
        // Always default to dark, regardless of OS preference — light mode
        // only applies once a visitor explicitly picks it here.
        let theme = "dark";

        try {
          const savedTheme = localStorage.getItem(key);
          if (savedTheme === "light" || savedTheme === "dark") {
            theme = savedTheme;
          }
        } catch (_error) {
          theme = "dark";
        }

        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Echo Shih — Product Engineer</title>
    <meta
      name="description"
      content="Product engineer in Taipei. I build systems of record — project platforms, applicant tracking, client histories — in React, TypeScript, FastAPI and Flutter."
    />
    <link
      rel="canonical"
      href="https://echoshih.com/"
    />

    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:url"
      content="https://echoshih.com/"
    />
    <meta
      property="og:title"
      content="Echo Shih — Product Engineer"
    />
    <meta
      property="og:description"
      content="From ambiguous product problems to shipped software."
    />
    <meta
      property="og:image"
      content="https://echoshih.com/og-image.png"
    />
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <style>
      /* Inline, not app.css: this has to be opaque before first paint, or
         the real page flashes through underneath for a frame. */
      #boot-gate {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #0b0a17;
        color: #a78bfa;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        transition: opacity 380ms ease;
      }
      #boot-gate-text {
        white-space: pre-wrap;
        font-size: 0.95rem;
        line-height: 1.6;
        margin: 0;
        max-width: 90vw;
      }
      #boot-gate.boot-gate-hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div
      id="boot-gate"
      aria-hidden="true"
    >
      <pre id="boot-gate-text"></pre>
    </div>
    <script>
      // A once-per-session fake boot sequence in front of the real
      // homepage, matching the terminal/cypherpunk motif elsewhere on the
      // site. Skipped on repeat visits within the tab session and entirely
      // under prefers-reduced-motion.
      (() => {
        const KEY = "echo-gate-seen";
        const gate = document.getElementById("boot-gate");
        const textEl = document.getElementById("boot-gate-text");
        if (!gate || !textEl) return;

        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        let seen = false;
        try {
          seen = sessionStorage.getItem(KEY) === "1";
        } catch (_error) {
          seen = false;
        }

        if (seen || reduceMotion) {
          gate.remove();
          return;
        }

        try {
          sessionStorage.setItem(KEY, "1");
        } catch (_error) {
          // Ignore storage failures — worst case the gate replays.
        }

        const lines = [
          "booting echo.dev ...",
          "loading profile: Echo Shih — Product Engineer",
          "systems nominal",
          "access granted_",
        ];
        let lineIndex = 0;
        let charIndex = 0;
        let out = "";

        function typeNext() {
          if (lineIndex >= lines.length) {
            setTimeout(() => {
              gate.classList.add("boot-gate-hide");
              setTimeout(() => gate.remove(), 420);
            }, 280);
            return;
          }
          const line = lines[lineIndex];
          if (charIndex < line.length) {
            out += line[charIndex];
            charIndex += 1;
            textEl.textContent = out;
            setTimeout(typeNext, 18);
          } else {
            out += "\n";
            charIndex = 0;
            lineIndex += 1;
            setTimeout(typeNext, 110);
          }
        }
        typeNext();
      })();
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
