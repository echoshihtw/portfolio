version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release: most malicious publishes
    # are pulled from npm within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    # Major versions are migrations, not bumps; plan them on their own branch.
    # Security updates still come through.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # typescript-eslint's packages must share one version; bumped alone, the
    # parser pulls a second copy of its internals (#193).
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
