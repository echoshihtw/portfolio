name: CI

# Verify on every pull request and every push to main. Vercel is the only live
# deploy now — Pages served the project URL for CVs already sent out, but that
# URL now redirects to echoshih.com (src/app.html), so its last GitHub Pages
# deploy stays frozen rather than being rebuilt on every push.
#
# Four jobs, one concern each:
#
#   quality → lint, types, unit tests. No TeX, no browser: ~40s, and it starts
#             immediately, so a formatting slip fails fast instead of after a
#             two-minute TeX install it had nothing to do with.
#   resume  → the PDF. Owns the TeX install and both caches, and hands the
#             result on as an artifact so nothing else pays for LaTeX.
#   build   → the static site, which needs the PDF to prerender.
#   e2e     → browser assertions against that exact build output.
#
# quality and resume run in parallel; build and e2e are a chain because each
# genuinely needs what the one before it produced.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".githooks/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version lives in .nvmrc and nowhere else, so `nvm use` here and the
      # runner cannot disagree. It matters that they do not: Node 24 ships npm
      # 11, and npm 11 records optional platform packages differently from npm
      # 10. A lockfile written by one and installed by the other fails — npm 10
      # tried to install @esbuild/netbsd-arm64 on a Linux runner.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Formatting and lint were a script nobody ran: `npm run lint` existed,
      # no hook called it, and CI did not either — so fifteen files had drifted
      # out of format without anything failing. Enforced here, in the one place
      # that cannot be skipped or left uninstalled on a new machine.
      - run: npm run lint

      - run: npm run check

      - run: npm test

  resume:
    name: Résumé PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installing TeX takes ~2 minutes and dominates this job, but the résumé
      # changes rarely. Key the built PDF on its sources: unchanged sources
      # mean no apt install and no rebuild.
      # The key is a glob, not a list of files. The list had already fallen
      # behind: the PDF is built from every config in src/content — projects
      # and skills each render a section of it — while the key named only
      # resume.md, so editing a project line or a skill hit the cache and
      # deployed a résumé that did not match its source, with nothing failing.
      # A glob cannot go stale when a new input file is added next to the
      # others. It over-invalidates when site-only copy changes, which costs
      # two minutes of TeX; under-invalidating costs a wrong PDF.
      - name: Restore built résumé
        id: resume
        uses: actions/cache@v6
        with:
          path: static/*.pdf
          key: resume-${{ hashFiles('src/content/**', 'scripts/buildResume.ts', 'scripts/resume-header.tex') }}

      # texlive-fonts-extra is about a gigabyte and it is not optional — the
      # résumé sets mainfont=XCharter, and Debian ships XCharter only there.
      # So cache the .debs. A résumé edit busts the PDF cache below on every
      # change; without this it would also re-download the whole of TeX each
      # time, which is the part that actually costs minutes.
      - name: Restore apt packages
        id: apt
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-resume-${{ hashFiles('scripts/resume-tex-packages.txt') }}

      # timeout-minutes because this step has hung: on 19 Aug it sat in
      # apt-get for 28 minutes with the log frozen, and a wedged step blocks
      # the job until the six-hour default. Ten minutes is roughly twice a
      # healthy cold install, so a timeout means something is wrong, not slow.
      # Retries cover the ordinary case of a mirror dropping a connection.
      - name: Install Pandoc and XeLaTeX
        if: steps.resume.outputs.cache-hit != 'true'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/keep-debs > /dev/null

          # Timeouts, not just retries. A retry only helps when the connection
          # fails; on 19 Aug it stalled mid-download of a 27MB package and sat
          # there, because apt has no timeout by default and will wait forever
          # on a socket that never closes.
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get update $APT_OPTS
          sudo apt-get install -y --no-install-recommends $APT_OPTS \
            $(grep -vE '^\s*(#|$)' scripts/resume-tex-packages.txt | tr '\n' ' ')

          # pandoc from its own release rather than apt: the apt copy is the
          # download that stalled, and pinning means CI and Vercel run the same
          # version instead of whatever Ubuntu happens to ship.
          PANDOC=$(cat scripts/pandoc-version.txt)
          curl -fsSL --retry 3 --retry-connrefused --max-time 180 \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC}/pandoc-${PANDOC}-linux-amd64.tar.gz" \
            | tar xz -C /tmp
          sudo install -m 0755 "/tmp/pandoc-${PANDOC}/bin/pandoc" /usr/local/bin/pandoc
          pandoc --version | head -1

      - run: npm ci

      # The résumé is a build output, not a committed file, so it cannot fall
      # behind resume.md. One page is a hard constraint, enforced here.
      - name: Build résumé
        if: steps.resume.outputs.cache-hit != 'true'
        run: |
          npm run build-resume
          # Globbed, not hardcoded: the PDF is named after me so the name
          # survives a cmd-S from the browser's viewer, and that name is
          # already spelled out in buildResume.ts, portfolio.config.ts and
          # vercel.json. Naming it a fourth time here is how this check
          # silently stopped running the last time it moved.
          count=$(ls static/*.pdf 2>/dev/null | wc -l)
          test "$count" = "1" || { echo "::error::expected exactly one PDF in static/, found $count"; exit 1; }
          pdf=$(ls static/*.pdf)
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          test "$pages" = "1" || { echo "::error::résumé must be one page, got $pages"; exit 1; }

      # Handed on rather than rebuilt: this is the only job that installs TeX,
      # and the site build below needs the PDF to prerender — a link to a
      # missing /resume.pdf fails the prerender outright.
      - name: Upload résumé
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: static/*.pdf
          retention-days: 1

  build:
    name: Build site
    needs: resume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          name: resume-pdf
          path: static/

      - run: npm ci

      # Vercel builds and deploys separately with its own default base (the
      # site serves from the root there). This build just has to succeed, and
      # then be handed to the browser tests, so it uses the same default.
      - run: npm run build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/
          retention-days: 1

  e2e:
    name: Browser tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The exact output the build job produced, not a rebuild of it. Nothing
      # here needs TeX, because nothing here rebuilds the PDF.
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: build/

      - run: npm ci

      # Chromium only: these assertions are about layout, focus order and which
      # hosts get called, not about engine differences.
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
