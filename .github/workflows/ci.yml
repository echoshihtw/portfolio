name: CI

# One pipeline: verify on every pull request and every push to main, deploy
# only from main. Previously this was two workflows repeating the same
# checkout / setup-node / npm ci / build, and svelte-check ran on pull
# requests only — so anything pushed straight to main deployed unchecked.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".githooks/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version lives in .nvmrc and nowhere else, so `nvm use` here and the
      # runner cannot disagree. It matters that they do not: Node 24 ships npm
      # 11, and npm 11 records optional platform packages differently from npm
      # 10. A lockfile written by one and installed by the other fails — npm 10
      # tried to install @esbuild/netbsd-arm64 on a Linux runner.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installing TeX takes ~2 minutes and dominates this job, but the résumé
      # changes rarely. Key the built PDF on its sources: unchanged sources
      # mean no apt install and no rebuild.
      # The key is a glob, not a list of files. The list had already fallen
      # behind: the PDF is built from every config in src/content — projects
      # and skills each render a section of it — while the key named only
      # resume.md, so editing a project line or a skill hit the cache and
      # deployed a résumé that did not match its source, with nothing failing.
      # A glob cannot go stale when a new input file is added next to the
      # others. It over-invalidates when site-only copy changes, which costs
      # two minutes of TeX; under-invalidating costs a wrong PDF.
      - name: Restore built résumé
        id: resume
        uses: actions/cache@v6
        with:
          path: static/resume.pdf
          key: resume-${{ hashFiles('src/content/**', 'scripts/buildResume.ts', 'scripts/resume-header.tex') }}

      # texlive-fonts-extra is about a gigabyte and it is not optional — the
      # résumé sets mainfont=XCharter, and Debian ships XCharter only there.
      # So cache the .debs. A résumé edit busts the PDF cache below on every
      # change; without this it would also re-download the whole of TeX each
      # time, which is the part that actually costs minutes.
      - name: Restore apt packages
        id: apt
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-resume-${{ hashFiles('scripts/resume-tex-packages.txt') }}

      # timeout-minutes because this step has hung: on 19 Aug it sat in
      # apt-get for 28 minutes with the log frozen, and a wedged step blocks
      # the job until the six-hour default. Ten minutes is roughly twice a
      # healthy cold install, so a timeout means something is wrong, not slow.
      # Retries cover the ordinary case of a mirror dropping a connection.
      - name: Install Pandoc and XeLaTeX
        if: steps.resume.outputs.cache-hit != 'true'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/keep-debs > /dev/null
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            $(grep -vE '^\s*(#|$)' scripts/resume-tex-packages.txt | tr '\n' ' ')

      - run: npm ci

      # Formatting and lint were a script nobody ran: `npm run lint` existed,
      # no hook called it, and CI did not either — so fifteen files had drifted
      # out of format without anything failing. Enforced here, in the one place
      # that cannot be skipped or left uninstalled on a new machine.
      - run: npm run lint

      - run: npm run check

      - run: npm test

      # The résumé is a build output, not a committed file, so it cannot fall
      # behind resume.md. One page is a hard constraint, enforced here.
      - name: Build résumé
        if: steps.resume.outputs.cache-hit != 'true'
        run: |
          npm run build-resume
          pages=$(pdfinfo static/resume.pdf | awk '/^Pages:/ {print $2}')
          test "$pages" = "1" || { echo "::error::résumé must be one page, got $pages"; exit 1; }

      - name: Build site
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/

  deploy:
    name: Deploy to Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
