name: Build and Deploy static content to GitHub Pages
on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Pandoc and XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-extra poppler-utils

      - name: Install dependencies
        run: npm ci

      # The résumé is a build output, so it is built here rather than
      # committed. It cannot go stale if it is made fresh every deploy.
      - name: Build résumé
        run: |
          npm run build-resume
          pages=$(pdfinfo static/resume.pdf | awk '/^Pages:/ {print $2}')
          test "$pages" = "1" || { echo "::error::résumé must be one page, got $pages"; exit 1; }

      - name: build
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"
        run: |
          npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        # this should match the `pages` option in your adapter-static options
        with:
          path: "build/"

      - name: Setup Pages
        uses: actions/configure-pages@v6

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
