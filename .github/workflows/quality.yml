name: Quality

# Deploy only runs on push to main, so nothing checked a pull request: a PR that
# broke the build merged cleanly and failed at deploy time, once it was already
# on main. This gate runs the same build a deploy would, before the merge.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm ci, same as deploy.yml — the lockfile is authoritative, so this
      # reproduces the deploy exactly.
      - name: Install dependencies
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: Build
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"
        run: npm run build
