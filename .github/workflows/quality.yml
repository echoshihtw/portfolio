name: Quality Gate

# Verifies every pull request, into staging or main. The checks live in
# verify.yml. Docs-only changes skip; safe because no check is required, so a
# skipped run cannot leave a PR pending.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/verify.yml
