name: Résumé

# Keeps the served résumé in step with its source. Editing resume.md and
# forgetting to run `npm run build-resume` used to leave static/resume.pdf —
# the file recruiters actually download — quietly describing an older version
# of me. Nothing caught that. Now main rebuilds it and commits the result.
#
# Note the paths filter excludes static/resume.pdf and src/lib/resumeData.ts:
# those are what this job writes, so it cannot retrigger itself.
on:
  push:
    branches: [main]
    paths:
      - "src/content/resume.md"
      - "src/content/projects.config.ts"
      - "scripts/buildResume.ts"
      - "scripts/resume-header.tex"
      - ".github/workflows/resume.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/content/resume.md"
      - "src/content/projects.config.ts"
      - "scripts/buildResume.ts"
      - "scripts/resume-header.tex"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Rebuild and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # xelatex comes from texlive-xetex, not texlive-latex-base. XCharter is
      # in texlive-fonts-extra and matches the local font, so CI and laptop
      # builds agree. poppler-utils gives pdfinfo and pdftotext for the checks.
      - name: Install Pandoc, XeLaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra \
            poppler-utils
          fc-cache -f

      - name: Install dependencies
        run: npm ci

      - name: Build résumé
        run: npm run build-resume

      # Two invariants that were only ever enforced by hand.
      - name: Verify one page and readable text
        run: |
          test -s output/resume.pdf || { echo "::error::resume.pdf missing or empty"; exit 1; }

          pages=$(pdfinfo output/resume.pdf | awk '/^Pages:/ {print $2}')
          echo "pages: $pages"
          if [ "$pages" != "1" ]; then
            echo "::error::résumé must be exactly one page, got $pages"
            exit 1
          fi

          # ATS readers extract text, not pixels. A PDF whose glyphs carry no
          # usable mapping looks fine to a human and is empty to a parser.
          chars=$(pdftotext output/resume.pdf - | tr -d '[:space:]' | wc -c)
          echo "extractable characters: $chars"
          if [ "$chars" -lt 1500 ]; then
            echo "::error::text extraction returned $chars chars — not ATS-readable"
            exit 1
          fi

          pdftotext output/resume.pdf - | head -5

      # On a PR, report drift instead of pushing to someone's branch.
      - name: Check the committed PDF is current
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- static/resume.pdf src/lib/resumeData.ts; then
            echo "::warning::static/resume.pdf is stale — main will refresh it on merge"
            git diff --stat -- static/resume.pdf src/lib/resumeData.ts
          fi

      - name: Commit the refreshed résumé
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- static/resume.pdf src/lib/resumeData.ts; then
            echo "already current, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/resume.pdf src/lib/resumeData.ts
          git commit -m "chore: refresh résumé PDF from resume.md [skip ci]"
          git push

      - name: Upload resume.pdf
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: output/resume.pdf
          if-no-files-found: error
